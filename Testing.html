<!doctype html>
<html>
<head>
<style>
  body { margin: 0; padding-top: 60px; font-family: sans-serif; background: #000; }

  .navbar {
    position: fixed; top: 0; left: 0; width: 100%; height: 60px;
    background: #0a0a0f; border-bottom: 1px solid #2a2a35;
    display: flex; align-items: center;
    justify-content: space-between; padding: 0 30px; box-sizing: border-box;
    z-index: 10;
  }
  .links { display: flex; overflow-x: auto; white-space: nowrap; }
  .navbar a { color: rgb(248, 248, 248); text-decoration: none; margin-left: 30px; }
  .navbar a:hover { color: #4da3ff; }
  .logo { color: white; font-weight: bold; font-size: 20px; }

  /* panels */
  .panels {
    display: flex;
    gap: 6px;
    padding: 6px;
    box-sizing: border-box;
    background: #000;
    height: calc(100vh - 60px);
  }
  .panel {
    flex: 1;
    background-color: #000;
    background-size: auto 70%;      /* planet image = 70% of panel height */
    background-position: center;
    background-repeat: no-repeat;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    border-radius: 14px;
    transition: flex 0.6s ease, filter 0.4s ease, background-size 0.6s ease;
  }
  /* dim the others while one is hovered */
  .panels:hover .panel:not(:hover) { filter: brightness(0.55); }
  .panel:hover { flex: 6; background-size: auto 100%; }

  /* names: vertical by default, horizontal on hover */
  .panel span {
    position: absolute; bottom: 30px; left: 50%;
    writing-mode: vertical-rl;
    transform: translateX(-50%) rotate(180deg);
    white-space: nowrap;
    color: white; font-size: 16px; font-weight: bold;
    letter-spacing: 4px; text-transform: uppercase;
    text-shadow: 0 2px 6px black;
  }
  .panel:hover span {
    writing-mode: horizontal-tb;
    transform: translateX(-50%);
    font-size: 26px;
  }

  .sun     { background-image: url(images/sun.jpg); background-size: cover; }
  .sun:hover { background-size: cover; }
  .moon    { background-image: url(images/moon.jpg); }
  .mercury { background-image: url(images/mercury.jpg); }
  .venus   { background-image: url(images/venus.jpg); }
  .earth   { background-image: url(images/earth.jpg); }
  .mars    { background-image: url(images/mars.jpg); }
  .jupiter { background-image: url(images/jupiter.jpg); background-size: auto 85%; }
  .saturn  { background-image: url(images/saturn.jpg);  background-size: auto 100%; background-position: 55% center; }
  .uranus  { background-image: url(images/uranus.jpg);  background-size: auto 92%; }
  .neptune { background-image: url(images/neptune.jpg); }
</style>
</head>
<body>
  <nav class="navbar">
    <span class="logo">The Solar System</span>
    <div class="links">
      <a href="#">Sun</a>
      <a href="#">Moon</a>
      <a href="#">Mercury</a>
      <a href="#">Venus</a>
      <a href="#">Earth</a>
      <a href="#">Mars</a>
      <a href="#">Jupiter</a>
      <a href="#">Saturn</a>
      <a href="#">Uranus</a>
      <a href="#">Neptune</a>
    </div>
  </nav>

  <div class="panels">
    <div class="panel sun"><span>The Sun</span></div>
    <div class="panel moon"><span>The Moon</span></div>
    <div class="panel mercury"><span>Mercury</span></div>
    <div class="panel venus"><span>Venus</span></div>
    <div class="panel earth"><span>Earth</span></div>
    <div class="panel mars"><span>Mars</span></div>
    <div class="panel jupiter"><span>Jupiter</span></div>
    <div class="panel saturn"><span>Saturn</span></div>
    <div class="panel uranus"><span>Uranus</span></div>
    <div class="panel neptune"><span>Neptune</span></div>
  </div>
</body>
</html>
